<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <title>Passive Tree Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Sarabun:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: #1D1F29;
    }
    #container {
        display: flex;
        height: 100%;
        width: 100%;
    }
    #treeCanvas {
        flex-grow: 1;
        background-color: #1D1F29;
    }
    #propertyPanel {
        width: 250px;
        background-color: #2D2F39;
        color: white;
        padding: 20px;
        box-sizing: border-box;
    }
    #searchBox {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    background: #1D1F29;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
    }
    #searchInfo {
    font-size: 0.8em;
    color: #aaa;
    margin: 6px 0 12px;
    min-height: 1em;
    }
    .point-box {
    margin: 14px 0 10px;
    padding: 10px 12px;
    background: #1D1F29;
    border: 1px solid #3a3d4d;
    border-radius: 6px;
    font-size: 0.85em;
    color: #c9cbd6;
    line-height: 1.6;
}

.btn-row {
    display: flex;
    gap: 8px;
}

.btn {
    flex: 1;
    padding: 9px 10px;
    font-size: 0.9em;
    font-weight: 600;
    letter-spacing: 0.03em;
    background: #1D1F29;
    border: 1px solid #555;
    border-radius: 6px;
    color: #e6e6e6;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.05s;
}

.btn:active:not(:disabled) {
    transform: translateY(1px);
}

.btn:focus-visible {
    outline: 2px solid #ffd700;
    outline-offset: 2px;
}

/* Allocate: ทอง */
.btn-allocate {
    color: #ffd700;
    border-color: rgba(255, 215, 0, 0.55);
}
.btn-allocate:hover:not(:disabled) {
    background: rgba(255, 215, 0, 0.12);
    border-color: #ffd700;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.35);
}

/* Unallocate: แดงอ่อน */
.btn-unallocate {
    color: #ff7b7b;
    border-color: rgba(255, 107, 107, 0.55);
}
.btn-unallocate:hover:not(:disabled) {
    background: rgba(255, 107, 107, 0.12);
    border-color: #ff6b6b;
    box-shadow: 0 0 10px rgba(255, 107, 107, 0.35);
}

/* Save: ปุ่มหลัก เต็มความกว้าง */
.btn-save {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    color: #1D1F29;
    background: linear-gradient(180deg, #ffd700, #d4a800);
    border-color: #ffd700;
}
.btn-save:hover:not(:disabled) {
    background: linear-gradient(180deg, #ffe34d, #e0b400);
    box-shadow: 0 0 14px rgba(255, 215, 0, 0.5);
}

/* ปิดใช้งาน */
.btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
}
.btn-save:disabled {
    background: #3a3d4d;
    border-color: #555;
    color: #888;
}
#propertyPanel {
    font-family: 'Sarabun', sans-serif;
    overflow-y: auto;
}

.panel-title {
    margin: 18px 0 10px;
    font-family: 'Cinzel', 'Sarabun', serif;
    font-size: 1.05em;
    letter-spacing: 0.08em;
    color: #ffd700;
    text-transform: uppercase;
    padding-bottom: 6px;
    border-bottom: 1px solid #3a3d4d;
}

.node-card {
    padding: 12px 14px;
    background: #1D1F29;
    border: 1px solid #3a3d4d;
    border-radius: 6px;
}

.node-card p {
    margin: 0;
}

/* ยังไม่เลือกโหนด */
.node-empty {
    display: none;
    color: #777;
    font-size: 0.85em;
    text-align: center;
    padding: 14px 0;
}
.node-card.empty .node-empty { display: block; }
.node-card.empty .node-content { display: none; }

/* ป้ายประเภทโหนด */
.node-badge {
    display: inline-block;
    padding: 1px 8px;
    margin-bottom: 8px;
    font-size: 0.65em;
    font-weight: 600;
    letter-spacing: 0.12em;
    border-radius: 10px;
    border: 1px solid #555;
    color: #aaa;
}
.node-badge[data-type="NOTABLE"]  { color: #6ec1ff; border-color: rgba(110,193,255,.5); }
.node-badge[data-type="KEYSTONE"] { color: #ffd700; border-color: rgba(255,215,0,.6); }

/* ชื่อโหนด */
#nodeName {
    font-family: 'Cinzel', 'Sarabun', serif;
    font-size: 1.1em;
    color: #ffd700;
    margin-bottom: 8px;
    word-break: break-word;
}
#nodeName.dream {
    color: #b464ff;
    text-shadow: 0 0 8px rgba(180, 100, 255, 0.5);
}

/* ค่าสถานะ */
#nodeStatusDes {
    color: #8fd694;
    font-weight: 600;
    font-size: 0.9em;
    line-height: 1.5;
    white-space: pre-line;
    margin-bottom: 8px;
}

/* คำอธิบาย */
#nodeDes {
    color: #d8dae5;
    font-size: 0.88em;
    line-height: 1.55;
    white-space: pre-line;
}

/* lore */
#nodeLore {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #3a3d4d;
    color: #8a8d9c;
    font-size: 0.8em;
    font-style: italic;
    line-height: 1.5;
    white-space: pre-line;
}

/* ซ่อนส่วนที่ไม่มีข้อความ */
#nodeStatusDes:empty,
#nodeDes:empty,
#nodeLore:empty { display: none; }

</style>

</head>
<body>
<div id="container">
<canvas id="treeCanvas"></canvas>
    <div id="propertyPanel">
        <select id="unitSelect" style="width:100%; margin-bottom:8px; padding:8px; background:#1D1F29; color:white; border:1px solid #555; border-radius:4px;"></select>
        <input id="searchBox" type="text" placeholder="ค้นหา node..." autocomplete="off">
        <div id="searchInfo"></div>
        <h2 class="panel-title">Node Property</h2>
<div id="nodeCard" class="node-card empty">
    <div class="node-empty">คลิกโหนดบนผังเพื่อดูรายละเอียด</div>
    <div class="node-content">
        <span id="nodeType" class="node-badge"></span>
        <p id="nodeName"></p>
        <p id="nodeStatusDes"></p>
        <p id="nodeDes"></p>
        <p id="nodeLore"></p>
    </div>
</div>

            <div class="point-box">
    <div id="pointInfo"></div>
    <div id="resetPointInfo"></div>
</div>

<div class="btn-row">
    <button id="btnAllocate" class="btn btn-allocate" disabled>Allocate</button>
    <button id="btnUnallocate" class="btn btn-unallocate" disabled>Unallocate</button>
</div>
<button id="btnSave" class="btn btn-save" disabled>Save</button>

    </div>
</div>

<script>
const canvas = document.getElementById('treeCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth - 250;
canvas.height = window.innerHeight;

let nodes = [];
const TO_REDUCE = 2400;

let searchActive = false;
let matchCount = 0;
const matchedIds = new Set();

const TEXT_FIELDS = ['name', 'description', 'statusDescription', 'lore'];
const originalText = new Map();   // id -> ข้อความต้นฉบับ
const dreamIds = new Set();

function restoreOriginals() {
    for (const n of nodes) {
        const o = originalText.get(n.id);
        if (o) Object.assign(n, o);
    }
    originalText.clear();
    dreamIds.clear();
}

function applyDreams(allocatedMap) {
    restoreOriginals();   // ล้างของ unit ก่อนหน้า

    const byId = new Map(nodes.map(n => [n.id, n]));   // (ถ้ามี nodeById อยู่แล้วใช้อันนั้น)
    for (const [key, p] of Object.entries(allocatedMap || {})) {
        if (!(p.dream === true || p.isDream === true)) continue;   // ดูหมายเหตุเรื่องชื่อ field ด้านล่าง
        const node = byId.get(Number(key));
        if (!node) continue;

        // เก็บต้นฉบับไว้ก่อนทับ
        originalText.set(node.id, Object.fromEntries(TEXT_FIELDS.map(f => [f, node[f]])));
        for (const f of TEXT_FIELDS) {
            if (p[f] != null) node[f] = p[f];
        }
        dreamIds.add(node.id);
    }
}

function runSearch(query) {
    const q = query.trim().toLowerCase();
    searchActive = q.length > 0;
    matchedIds.clear();

    if (searchActive) {
        const terms = q.split(/\s+/); // หลายคำ ต้องเจอทุกคำ
        for (const n of nodes) {
            const text = [n.name, n.statusDescription, n.description, n.lore]
                .filter(Boolean).join(' ').toLowerCase();
            if (terms.every(t => text.includes(t))) matchedIds.add(n.id);
        }
    }
    matchCount = matchedIds.size;

    const el = document.getElementById('searchInfo');
    el.innerText = !searchActive ? '' : (matchCount ? `พบ ${matchCount} node` : 'ไม่พบ');

    drawTree();
}

let searchTimer;
const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(searchBox.value), 150);
});
searchBox.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        searchBox.value = '';
        runSearch('');
    }
});

let selectedNode = null;

let offsetX = 0;   // การเลื่อนหน้าจอ
let offsetY = 0;
let scale = 1.0;   // การซูม

let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let lastTouchX = 0;
let lastTouchY = 0;
        // วาดโหนด
const images = {
SMALL: new Image(),
NOTABLE: new Image(),
KEYSTONE: new Image()
};

images.SMALL.src = "/lastopus-passive-tree/images/small_node3.png";
images.NOTABLE.src = "/lastopus-passive-tree/images/notable_node3.png";
images.KEYSTONE.src = "/lastopus-passive-tree/images/keystone_node3.png";

const imageSizes = {
SMALL: 60,
NOTABLE: 80,
KEYSTONE: 100
};

Promise.all([
new Promise(resolve => images.SMALL.onload = resolve),
new Promise(resolve => images.NOTABLE.onload = resolve),
new Promise(resolve => images.KEYSTONE.onload = resolve),
]).then(() => {
renderNodes();
});

// ฟังก์ชันวาด
    function drawTree() {
    ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY); // แปลงพิกัด
    ctx.clearRect(-offsetX / scale, -offsetY / scale, canvas.width / scale, canvas.height / scale);

    // วาดเส้นเชื่อม
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2 / (scale * 1.5);
    for (const node of nodes) {
    if (!node.connectedNodes) continue;
    for (const connId of node.connectedNodes) {
        const target = nodes.find(n => n.id === connId);
        if (!target) continue;

        const lit = unitActive && allocatedIds.has(node.id) && allocatedIds.has(target.id);

        ctx.strokeStyle = lit ? 'gold' : 'white';
        ctx.globalAlpha = (unitActive && !lit) ? 0.25 : 1;

        const a = centerOf(node);
        const b = centerOf(target);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
    }
}
ctx.globalAlpha = 1;

renderNodes();
}

// ฟังก์ชันอัปเดต Property Panel
function updatePropertyPanel(node) {
    const card = document.getElementById('nodeCard');
    card.classList.toggle('empty', !node);
    if (!node) return;

    const badge = document.getElementById('nodeType');
    badge.textContent = node.nodeType || '';
    badge.dataset.type = node.nodeType || '';

    const nameEl = document.getElementById('nodeName');
    nameEl.textContent = node.name || '';
    nameEl.classList.toggle('dream', dreamIds.has(node.id));   // <- เพิ่ม

    document.getElementById('nodeStatusDes').textContent = node.statusDescription || '';
    document.getElementById('nodeDes').textContent = node.description || '';
    document.getElementById('nodeLore').textContent = node.lore || '';
}

function centerOf(node) {
    const half = imageSizes[node.nodeType] / 2;
    return {
        x: node.x - TO_REDUCE + half,
        y: node.y - TO_REDUCE + half
    };
}

function renderNodes() {
    for (const node of nodes) {
        const image = images[node.nodeType];
        const imageSize = imageSizes[node.nodeType];
        if (!image || !imageSize) continue;

        const c = centerOf(node);
        const isMatch = matchedIds.has(node.id);
        const isAllocated = allocatedIds.has(node.id);

        let alpha = 1;
        if (unitActive && !isAllocated) alpha = 0.25;
        else if (!unitActive && searchActive && !isMatch) alpha = 0.2;

        ctx.globalAlpha = alpha;

        // แสงเรืองรอบ node ที่ allocate
        if (unitActive && isAllocated) {
            ctx.shadowColor = dreamIds.has(node.id)
                ? 'rgba(180, 100, 255, 0.95)'   // ม่วง = Dream
                : 'rgba(255, 215, 0, 0.9)';     // ทอง = ปกติ
            ctx.shadowBlur = 25;
        }
        ctx.drawImage(image, c.x - imageSize / 2, c.y - imageSize / 2, imageSize, imageSize);

        // รีเซ็ต shadow ไม่ให้ไปติดตัวอื่น
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;

        if (searchActive && isMatch) {
            ctx.beginPath();
            ctx.arc(c.x, c.y, imageSize / 2 + 2, 0, Math.PI * 2);
            ctx.strokeStyle = 'cyan';
            ctx.lineWidth = 3 / scale;
            ctx.stroke();
        }

        if (node === selectedNode) {
            ctx.beginPath();
            ctx.arc(c.x, c.y, imageSize / 2 + 4, 0, Math.PI * 2);
            ctx.strokeStyle = 'gold';
            ctx.lineWidth = 3 / scale;
            ctx.stroke();
        }
    }
}

// เมื่อคลิกเพื่อเลือกโหนด
canvas.addEventListener('click', (e) => {
    if (isDragging) return;

    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left - offsetX) / scale;
    const clickY = (e.clientY - rect.top - offsetY) / scale;

    selectedNode = null;
    let bestDist = Infinity;
    for (const node of nodes) {
        const c = centerOf(node);
        const radius = imageSizes[node.nodeType] / 2;
        const dist = Math.hypot(c.x - clickX, c.y - clickY);
        if (dist <= radius && dist < bestDist) {
            bestDist = dist;
            selectedNode = node;
        }
    }
    updatePropertyPanel(selectedNode);
    updateButtons();
    drawTree();
});

// ลากหน้าจอด้วยเมาส์
canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    dragStartX = e.clientX - offsetX;
    dragStartY = e.clientY - offsetY;
});

canvas.addEventListener('mousemove', (e) => {
    if (isDragging) {
        offsetX = e.clientX - dragStartX;
        offsetY = e.clientY - dragStartY;
        drawTree();
    }
});

canvas.addEventListener('mouseup', () => {
    isDragging = false;
});

canvas.addEventListener('mouseleave', () => {
    isDragging = false;
});

// ซูมด้วย Scroll
canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = 1.1;
    const mouseX = (e.offsetX - offsetX) / scale;
    const mouseY = (e.offsetY - offsetY) / scale;

    if (e.deltaY < 0) { // scroll ขึ้น = zoom in
        scale *= zoomFactor;
    } else { // scroll ลง = zoom out
        scale /= zoomFactor;
    }

    // ทำให้ซูมเข้าหรือออกไปทางจุดที่เมาส์อยู่
    offsetX = e.offsetX - mouseX * scale;
    offsetY = e.offsetY - mouseY * scale;

    drawTree();
});

    canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        isDragging = true;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    if (isDragging && e.touches.length === 1) {
        const touchX = e.touches[0].clientX;
        const touchY = e.touches[0].clientY;

        offsetX += touchX - lastTouchX;
        offsetY += touchY - lastTouchY;

        lastTouchX = touchX;
        lastTouchY = touchY;

        drawTree();
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    isDragging = false;
});

    function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
        e.preventDefault();
        const newDistance = getTouchDistance(e.touches);

        if (lastTouchDistance) {
            const delta = newDistance - lastTouchDistance;
            const zoomFactor = 1.01;
            const zoom = delta > 0 ? zoomFactor : 1 / zoomFactor;

            const rect = canvas.getBoundingClientRect();
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
            const worldX = (midX - offsetX) / scale;
            const worldY = (midY - offsetY) / scale;

            scale *= zoom;
            offsetX = midX - worldX * scale;
            offsetY = midY - worldY * scale;

            drawTree();
        }

        lastTouchDistance = newDistance;
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    lastTouchDistance = 0;
});

fetch('passives-display.json')
    .then(response => response.json())
    .then(data => {
        nodes = data;
        indexNodes();
        drawTree();
        renderNodes();
    });

    //load unit จาก server
    const UNIT_NAMES = [
  "Select", "Akivili", "Leda", "Pumpkin'Slayerman", "Acheros Aki", "Twelve",
  "Slafier", "Shiranui", "Four-Leaf Clover777", "Onebrek", "Christ",
  "Aard Archer", "Esther", "Yasha", "Voahri", "Scarlet", "Marrhe", "Q-Bik", "Silver Obsidian"
];

const allocatedIds = new Set();
let unitActive = false;
let currentUnit = null;      // ข้อมูล unit จาก /get_unit
let allocatedMap = {};       // id -> PassiveNode (ตัวที่จะส่งกลับ)
let remainingPoints = 0;
let resetPoints = 0;
let originalRemaining = 0;      // passive point ตอนโหลด unit
let originalResetPoints = 0;    // starmap_reset_point ตอนโหลด unit
let nodeById = new Map();
let rootId = null;
let dirty = false;
let originalIds = new Set();

function indexNodes() {
    nodeById = new Map(nodes.map(n => [n.id, n]));
    const root = nodes.find(n => !n.connectedNodes || n.connectedNodes.length === 0);
    rootId = root ? root.id : null;
}

// ปรับตรงนี้ให้ตรงกับ JSON จริงของ unit
function extractAllocatedIds(unit) {
    const map = unit.allocatedPassives || {};
    return Object.keys(map).map(Number);
}

function setAllocated(ids, allocatedMap = null) {
    allocatedIds.clear();
    ids.forEach(id => allocatedIds.add(id));
    applyDreams(allocatedMap);          // ← เพิ่ม
    unitActive = ids.length > 0;
    updatePropertyPanel(selectedNode);  // รีเฟรช panel ถ้ากำลังเลือก node อยู่
    runSearch(searchBox.value);         // search ใหม่ (เรียก drawTree ให้เอง)
}

function canAllocate(node) {
    if (allocatedIds.has(node.id)) return false;
    if (remainingPoints <= 0) return false;
    if (node.id === rootId) return true;
    return (node.connectedNodes || []).some(id => allocatedIds.has(id));
}

function canDeallocate(node) {
    const id = node.id;
    if (!allocatedIds.has(id) || id === rootId) return false;
    if (originalIds.has(id) && resetPoints <= 0) return false;

    const visited = new Set();
    const queue = [];

    // จุดเริ่ม = โหนดที่ลงอยู่และติดกับ root
    for (const aid of allocatedIds) {
        if (aid === id || aid === rootId) continue;
        const n = nodeById.get(aid);
        if (n && (n.connectedNodes || []).includes(rootId)) {
            visited.add(aid);
            queue.push(aid);
        }
    }

    // เดินต่อผ่านโหนดที่ลงอยู่ โดยข้ามโหนดที่จะถอน
    while (queue.length) {
        const cur = nodeById.get(queue.shift());
        for (const next of (cur.connectedNodes || [])) {
            if (next === id || next === rootId) continue;
            if (allocatedIds.has(next) && !visited.has(next)) {
                visited.add(next);
                queue.push(next);
            }
        }
    }

    // ที่เหลือทุกตัวต้องเดินถึง
    for (const aid of allocatedIds) {
        if (aid === id || aid === rootId) continue;
        if (!visited.has(aid)) return false;
    }
    return true;
}

function refreshFromMap() {
    // ผ่าน setAllocated เพื่อให้ dream, search, วาดใหม่ ทำงานครบ
    recalcPoints();
    setAllocated(Object.keys(allocatedMap).map(Number), allocatedMap);
    updateButtons();
}

function recalcPoints() {
    const current = new Set(Object.keys(allocatedMap).map(Number));
    let added = 0, removed = 0;
    for (const id of current) if (!originalIds.has(id)) added++;
    for (const id of originalIds) if (!current.has(id)) removed++;

    remainingPoints = originalRemaining - (added - removed);
    resetPoints = originalResetPoints - removed;
}

function updateButtons() {
    document.getElementById('pointInfo').innerText =
        currentUnit ? `Starmap Point คงเหลือ: ${remainingPoints}` : '';
    document.getElementById('resetPointInfo').innerText =
        currentUnit ? `Reset Point คงเหลือ: ${resetPoints}` : '';
    document.getElementById('btnAllocate').disabled =
        !(selectedNode && currentUnit && canAllocate(selectedNode));
    document.getElementById('btnUnallocate').disabled =
        !(selectedNode && currentUnit && canDeallocate(selectedNode));
    document.getElementById('btnSave').disabled = !(currentUnit && dirty);
}

document.getElementById('btnAllocate').onclick = () => {
    if (!selectedNode || !canAllocate(selectedNode)) return;
    allocatedMap[selectedNode.id] = { ...selectedNode };
    dirty = true;
    refreshFromMap();
};

document.getElementById('btnUnallocate').onclick = () => {
    if (!selectedNode || !canDeallocate(selectedNode)) return;
    delete allocatedMap[selectedNode.id];
    dirty = true;
    refreshFromMap();
};

document.getElementById('btnSave').onclick = async () => {
    const current = new Set(Object.keys(allocatedMap).map(Number));
    const added = [...current].filter(id => !originalIds.has(id));
    const removed = [...originalIds].filter(id => !current.has(id));

    try {
        const res = await fetch('https://lastopus-discord-service.onrender.com/save_passives', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: currentUnit.name, added, removed })
        });
        const data = await res.text();
      alert(data);
      if (!res.ok) return;          // error: อยู่หน้าเดิม ให้ผู้ใช้แก้ต่อได้
      window.location.reload();
        originalIds = current;      // ครั้งหน้าคิดส่วนต่างจากจุดนี้
        dirty = false;
        updateButtons();
    } catch (err) {
        alert('บันทึกไม่สำเร็จ: ' + err.message);
    }
};

function resetUnit() {
    currentUnit = null;
    allocatedMap = {};
    originalIds = new Set();
    originalRemaining = 0;
    originalResetPoints = 0;
    dirty = false;
    refreshFromMap();
}

function renderComboBox() {
    const select = document.getElementById('unitSelect');
    select.innerHTML = '';
    UNIT_NAMES.forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
    });

select.onchange = async () => {
    const selected = select.value;
    if (selected === 'Select') {
        resetUnit();
        return;
    }
    try {
        const res = await fetch(
            `https://lastopus-discord-service.onrender.com/get_unit?name=${encodeURIComponent(selected)}`
        );
        const data = await res.json();
        currentUnit = data;
        allocatedMap = data.allocatedPassives || {};
        originalIds = new Set(Object.keys(allocatedMap).map(Number));
        originalRemaining = data.remainingPassiveTreePoint || 0;
        originalResetPoints = data.starmap_reset_point || 0;
        dirty = false;
        refreshFromMap();
    } catch (err) {
        console.error('โหลด unit ไม่สำเร็จ', err);
        resetUnit();
    }
};
}

renderComboBox();
</script>


</body>
</html>
